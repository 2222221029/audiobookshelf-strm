name: Build STRM Docker Image

# 构建 STRM 定制版 Docker 镜像并推送到 GitHub 容器仓库 (GHCR)。
# 触发方式：
#   1) 推送形如 strm-v2.35.1 的 tag 时自动构建（镜像 tag 取 2.35.1）
#   2) 在 Actions 页面手动运行 (workflow_dispatch)，可自定义镜像 tag
# 镜像地址：ghcr.io/<你的用户名>/audiobookshelf-strm

on:
  push:
    tags:
      - 'strm-v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像 tag（如 2.35.1 或 latest）'
        required: true
        default: 'latest'

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/audiobookshelf-strm

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=match,pattern=strm-v(\d+\.\d+\.\d+),group=1
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
